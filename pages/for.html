
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Eat - Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f8ed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 1420px;
            min-height: 700px;
            display: flex;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 35px #00000015;
        }

        /* Left Food Image */
        .image-section {
            width: 50%;
            background-image: url(
                "https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1000&q=90"
            );
            background-size: cover;
            background-position: center;
        }

        /* Right Form */
        .form-section {
            width: 50%;
            padding: 50px 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo */
        .logo {
            font-size: 35px;
            font-weight: bold;
            color: #087b27;
            margin-bottom: 40px;
        }

        /* Lock Icon */
        .lock-icon {
            width: 105px;
            height: 105px;
            background: #e6f7df;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: 0 auto 20px;
        }

        /* Heading */
        h1 {
            font-size: 45px;
            line-height: 1.15;
            margin: 0 0 12px;
            color: #111;
        }

        h1 span {
            color: #087b27;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.5;
            color: #555;
            margin-bottom: 35px;
        }

        /* Email Input */
        input {
            width: 100%;
            padding: 18px;
            border: 1.5px solid #d5d5d5;
            border-radius: 12px;
            outline: none;
            font-size: 17px;
        }

        input:focus {
            border-color: #16832d;
        }

        /* Reset Button */
        .reset-btn {
            width: 100%;
            padding: 18px;
            margin-top: 25px;
            background: #087b0b;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #056408;
        }

        /* Back to Login */
        .back {
            text-align: center;
            margin-top: 45px;
        }

        .back a {
            color: #087b27;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media(max-width: 750px) {

            body {
                padding: 15px;
            }

            .container {
                flex-direction: column;
                border-radius: 20px;
            }

            .image-section {
                width: 100%;
                height: 230px;
            }

            .form-section {
                width: 100%;
                padding: 35px 25px;
            }

            .logo {
                font-size: 27px;
                margin-bottom: 30px;
            }

            h1 {
                font-size: 34px;
            }

            .subtitle {
                font-size: 15px;
            }

            .back a {
                font-size: 17px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- Left Food Image -->
        <div class="image-section"></div>

        <!-- Forgot Password Form -->
        <div class="form-section">

            <div class="logo">
                🌿 SMART EAT
            </div>

            <div class="lock-icon">
                🔒
            </div>

            <h1>
                Forgot Your<br>
                <span>Password?</span>
            </h1>

            <p class="subtitle">
                Don't worry! Enter your registered email address
                and we'll help you reset your password.
            </p>

            <form id="resetForm">

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <button type="submit" class="reset-btn">
                    Reset Password
                </button>

            </form>

            <div class="back">
                <a href="login.html">
                    ← &nbsp; Back to Login
                </a>
            </div>

        </div>

    </div>

    <script>
        document.getElementById("resetForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            try {
                const res = await fetch("/api/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: document.getElementById("email").value })
                });
                const data = await res.json().catch(() => ({}));
                alert(data.message || data.error || "Something went wrong.");
            } catch (err) {
                alert("Could not reach the server. Is it running?");
            }

        });
    </script>

</body>
</html>
